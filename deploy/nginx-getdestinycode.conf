# Destiny Code — сайт getdestinycode.ru (reverse proxy на uvicorn :8100).
# Кладётся в /etc/nginx/sites-available/getdestinycode.ru и симлинкуется в
# sites-enabled. TLS (блок 443 + редирект с 80) добавит `certbot --nginx`.
server {
    listen 80;
    listen [::]:80;
    server_name getdestinycode.ru www.getdestinycode.ru;

    # Тело запроса маленькое (вопрос ≤500 символов); приложение и так режет >8КБ.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-стриминг толкования (/api/reading/stream): без буферизации,
        # с длинным таймаутом, иначе текст не идёт «по мере генерации».
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
