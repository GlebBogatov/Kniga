# Blueprint для Render.com: один Docker-сервис — бэкенд FastAPI + собранный
# фронтенд по одному адресу. Подключается через New + → Blueprint → этот репозиторий.
services:
  - type: web
    name: kniga-peremen
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- ИИ через Timeweb AI Gateway (OpenAI-совместимый, оплата в рублях) ---
      - key: LLM_PROVIDER
        value: "timeweb"
      - key: TIMEWEB_BASE_URL
        value: "https://api.timeweb.ai/v1"
      - key: MODEL_INTERPRETATION
        value: "anthropic/claude-sonnet-5"
      - key: MODEL_LIGHT
        value: "anthropic/claude-haiku-4-5"
      # Ключ инференса Timeweb (sk-...) — задаётся в дашборде Render (Secret).
      # Без него ИИ недоступен: сайт работает, но вместо толкования — классика.
      - key: TIMEWEB_API_KEY
        sync: false
      # --- Постоянная БД (PostgreSQL) ---
      # Строка подключения задаётся в дашборде Render (Secret). Подходит любой
      # управляемый Postgres: Timeweb Cloud / Render / Neon. Формат:
      #   postgresql://USER:PASSWORD@HOST:PORT/DBNAME?sslmode=require
      # Приложение само приведёт схему к psycopg. Без неё — эфемерный SQLite.
      - key: DATABASE_URL
        sync: false
      # Вход-заглушка VK/Яндекс (внешний OAuth пока не подключён).
      - key: ALLOW_DEV_LOGIN
        value: "true"
      - key: FREEMIUM_ENABLED
        value: "true"
      # Фронт на том же адресе — CORS не нужен; ставим разрешительно на всякий.
      - key: CORS_ORIGINS
        value: "*"
